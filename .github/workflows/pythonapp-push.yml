name: Python application Push

on:
  push:
    branches:
      - 'eol-release/*'

jobs:
  test:
    uses: eol-uchile/workflow-commons/.github/workflows/pythonapp.yml@pythonapp-2
    with:
      app_id: ${{ vars.EOLITO_BOT_APP_ID }}
      django-lms: true
      django-cms: false
    secrets:
      private_key: ${{ secrets.EOLITO_BOT_PRIVATE_KEY }}
